manifestVersion: 1
id: btc-commons-node-view
storage:
  dataRoot: data
category: bitcoin
name: Commons Node View
version: "0.2.4"
tagline: Set up and run a Bitcoin node from one page
icon: https://raw.githubusercontent.com/BTCDecoded/commons-umbrel-store/main/assets/btc-commons-node-view/icon.svg
description: >-
  Commons Node View installs and runs a Bitcoin full node for you, and shows you what it is doing. One download, no
  command line: open the app and a short guided setup walks you through it.


  How it works:


  - Pick a network. Mainnet is the real Bitcoin network (about 800 GB, days to sync). Signet and Testnet4 are free
  practice networks with no real value, and much smaller.

  - When you choose, the app downloads the node program from the official Bitcoin Commons release on GitHub, checks
  it against the release's published checksum (releases are not signed yet), and starts it. Nothing is bundled that
  you did not ask for.

  - Switch to another network any time. The node stops cleanly, every network keeps its own data, and switching
  back picks up where it stopped.

  - New node releases are installed from the same page, when you decide. Add-on modules will follow.


  The home page shows sync progress, your height against the network, and a globe with your peers. Other pages
  list peers, show the node's log, and hold the settings.


  Before you install:


  - Disk space: Mainnet needs about 800 GB, Testnet3 over 100 GB. The app warns you when a switch would not fit.

  - Network ports: Mainnet uses port 8334, not the usual 8333, because Umbrel's Bitcoin Node holds 8333. Both apps can
  run at the same time. The test networks use their standard ports (Testnet3 18333, Testnet4 48333, Signet 38333,
  Regtest 18444). Docker publishes all five of those ports on every install. Each one has to be free or the app
  will not start, whichever network you pick. To accept incoming peers, forward your network's port on your router
  to your Umbrel.

  - The old Commons UI app uses the same web port (3849). If you have it installed, uninstall it before you install
  this one.

  - This is early software from Bitcoin Commons. Expect rough edges and report them.


  Commons Node View never touches your wallet or funds. Peer locations are country-level and looked up offline on
  your Umbrel. IP Geolocation by DB-IP (https://db-ip.com), licensed under CC BY 4.0.
releaseNotes: >-
  Backups skip each network's chain database. Settings, the installed node program, and logs are still included.


  All five peer ports (8334, 18333, 48333, 38333, and 18444) are opened on every install. Each one has to be free
  or the app will not start, even if you only use one network.


  New: choose, for each network, how much of the chain the node checks fully (assume-valid), so a node catches up
  much faster.


  New: block pruning. "Blocks to keep" lets the node keep only the latest blocks and use far less disk space. The Chain
  tab and the dashboard show what is stored.


  Settings is now split into sub-pages, and the sync display shows the validated height, the sync rate and a hint
  while the node waits for peers.


  The app now checks, before downloading the node, whether the computer can run it (some ARM64 devices with a 16 KB
  kernel page size cannot). You can still try anyway.


  Mainnet P2P port moved to 8334. If you forward port 8333 on your router for this app, change the rule from 8333 to
  8334. Umbrel's own Bitcoin Node can now run at the same time.


  Known limitation: a Raspberry Pi 5 cannot run the current official node release until a build with 16 KB page
  support exists.


  Existing installs keep their settings and data.
