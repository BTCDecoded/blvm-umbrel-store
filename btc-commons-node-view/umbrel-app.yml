backupIgnore:
  # Blocks, the UTXO set, and indexes are LMDB trees in heed3/data.mdb. The node is
  # started with --data-dir ./data and its working directory is networks/<id>, so the
  # file is data/networks/<id>/data/heed3/data.mdb. console.json and bin/installed.json
  # are outside these paths.
  - data/networks/mainnet/data/heed3
  - data/networks/testnet4/data/heed3
  - data/networks/testnet/data/heed3
  - data/networks/signet/data/heed3
  - data/networks/regtest/data/heed3
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Bitcoin Commons
submission: https://github.com/BTCDecoded/commons-umbrel-store
