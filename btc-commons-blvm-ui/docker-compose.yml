version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<service-name>_1
      APP_HOST: btc-commons-blvm-ui_web_1
      APP_PORT: 3849

  web:
    # Multi-arch index digest (linux/amd64 + linux/arm64) of the v0.1.0 build.
    image: ghcr.io/btcdecoded/blvm-ui:0.1.0@sha256:972c383729db1252aebfe5b79f4f0dc17a39033b865ce67711e35727a7dab060
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 10s
    volumes:
      # Latest Blocks history (feeds.json)
      - ${APP_DATA_DIR}/data:/data
    environment:
      BLVM_UI_LISTEN: 0.0.0.0:3849
      BLVM_UI_STATE_DIR: /data
      # The Bitcoin node app this depends on (Bitcoin Node, Knots, or anything that implements `bitcoin`).
      BLVM_UI_RPC: ${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_RPC_PORT}
      BLVM_UI_RPC_USER: ${APP_BITCOIN_RPC_USER}
      BLVM_UI_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
